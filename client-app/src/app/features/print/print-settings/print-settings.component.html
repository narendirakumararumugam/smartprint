<div class="step-panel" id="panel3">
  <div class="step-title">Configure Print Settings</div>
  <div class="step-sub">
    Customise how each document should be printed. Prices update live.
  </div>

  <div class="step3-layout">
    <div class="config-side">
      <div class="config-file-tabs mt-2">
        @for(filename of filenames; track filename){
          <div class="cfg-tab" [class.active]="filename === selectedFile()" (click)="setSelectedFile(filename)">
            <i class="bx bx-file"></i>
            {{filename}}
          </div>
        }
      </div>

      <app-print-file-config [filename]="selectedFile()" [printFileConfig]="selectedPrintFileConfig"></app-print-file-config>

      <div class="addon-section-title d-flex align-items-center my-2 gap-1">
        <i class="bxf bx-puzzle"></i> Add-ons & Finishing
      </div>
      <div class="addon-grid">
        @for (addOn of addonList; track addOn) {
          <div class="addon-card d-flex flex-column align-items-center">
            <i [class]="addOn.icon"></i>
            <span class="addon-name">{{ addOn.name }}</span>
            <span class="addon-price">+₹{{ addOn.price }}</span>
          </div>
        }
      </div>
    </div>
</div>
