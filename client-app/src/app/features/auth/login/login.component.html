<div class="right-panel d-flex align-items-center justify-content-center">
  <div class="form-wrap">
    <div class="welcome-badge d-inline-flex align-items-center gap-2 mb-3">
      Welcome back!
    </div>
    <div class="form-heading mb-2">Sign in to SmartPrint</div>

    <form class="login-form">
      <div class="form-group">
        <div class="fg-label">
          <label for="usernameInput">Username</label>
        </div>

        <div class="input-wrap">
          <i class="input-icon bxf bx-user"></i>
          <input
            class="form-input"
            type="text"
            id="usernameInput"
            placeholder="Enter your username"
          />
        </div>
        <div class="field-error" id="unameErr">
          <i class="bxf-bx-alert-triangle"></i>
          <span id="unameErrMsg"> Please enter a valid username </span>
        </div>
      </div>
      <div class="form-group">
        <div class="fg-label">
          <label for="pwdInput">Password</label>
          <a href="/">Forgot password?</a>
        </div>
        <div class="input-wrap">
          <i class="input-icon bxf bx-lock"></i>
          <input
            class="form-input"
            type="password"
            id="pwdInput"
            placeholder="Enter your password"
          />
          <span class="pwd-toggle" id="pwToggle">
            <i class="bx bx-eye-alt"></i>
          </span>
        </div>
        <div class="field-error" id="pwdErr">
          <i class="bxf-bx-alert-triangle"></i>
          <span id="pwdErrMsg"> Password is required </span>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBnt">
        <span id="btnText">
          <i class="bxf bx-arrow-in-right-stroke-circle-half"></i>
          Sign In
        </span>
        <!-- <span id="btnLoader">
        <i class="bxf bx-loader-dots"></i>
        Signing in...
      </span> -->
      </button>
    </form>
    <div class="divider d-flex align-items-center gap-2 my-3">
      <span>or sign in with google</span>
    </div>

    <div class="social-btns w-100">
      <button
        class="social-btn w-100 d-flex justify-content-center align-items-center gap-2 p-2 my-3"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 50 50"
        >
          <path
            fill="#FFC107"
            d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"
          ></path>
          <path
            fill="#FF3D00"
            d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"
          ></path>
          <path
            fill="#4CAF50"
            d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"
          ></path>
          <path
            fill="#1976D2"
            d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"
          ></path>
        </svg>
        Continue with google
      </button>
    </div>

    <p class="form-sub mb-2">
      Don't have an account?
      <a href="#" (click)="goToSignup($event)">Sign up free</a> - it takes less
      than a minute!
    </p>
  </div>
</div>
