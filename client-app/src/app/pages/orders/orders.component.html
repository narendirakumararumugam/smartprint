<app-order-header
  [totalOrders]="orders.length"
  [activeCount]="getCount('active')"
  [completedCount]="getCount('completed')"
  [totalSpent]="totalSpent"
>
</app-order-header>

<div class="content-wrap">
  <div class="content-card">
    <div class="tabs">
      <div
        class="tab"
        *ngFor="let t of tabs; trackBy: trackByIndex"
        [class.active]="activeTab === t.key"
        (click)="setTab(t.key)"
      >
        {{ t.label }}
        <span class="tab-count">{{ getCount(t.key) }}</span>
      </div>
    </div>

    <div class="tools-bar">
      <div class="tb-search">
        <i class="bx bx-search"></i>
        <input
          type="search"
          placeholder="Search orders, shops..."
          autocomplete="off"
          [(ngModel)]="searchQuery"
          (ngModelChange)="applyFilters()"
        />
      </div>
      <div class="tb-right">
        <app-dropdown
          [options]="sortOptions"
          [selected]="sortBy"
          (selectionChange)="sortBy = $any($event); applyFilters()"
          variant="borderless"
        >
        </app-dropdown>
      </div>
    </div>

    <div class="orders-list">
      <app-order-card
        *ngFor="
          let order of filteredOrders;
          let i = index;
          trackBy: trackByOrderId
        "
        [order]="order"
        [animationDelay]="i * 60"
        (viewOrder)="openModal($event)"
        (cancelClicked)="cancelOrder($event)"
        (confirmPickupClicked)="confirmPickup($event)"
        (reorderClicked)="reorder($event)"
      >
      </app-order-card>
    </div>

    <div class="empty-state" *ngIf="!filteredOrders.length">
      <div class="empty-icon"><i class="bx bx-list-ul"></i></div>
      <div class="empty-title">No orders found</div>
      <div class="empty-sub">
        Try a different filter or start a new print order.
      </div>
      <a routerLink="/"
        ><button class="btn btn-primary">
          <i class="bx bx-store"></i> Find a Shop
        </button></a
      >
    </div>
  </div>
</div>

<app-order-detail-modal
  [order]="selectedOrder"
  [isOpen]="isModalOpen"
  (close)="closeModal()"
  (cancelClicked)="cancelOrder($event)"
  (confirmPickupClicked)="confirmPickup($event)"
  (reorderClicked)="reorder($event)"
>
</app-order-detail-modal>

<app-toast-container></app-toast-container>
