<div class="stars" [class.stars-lg]="size === 'lg'">
  <ng-container *ngFor="let state of rating | stars">
    <i *ngIf="state === 'full'" class="bx bxs-star f"></i>
    <i *ngIf="state === 'half'" class="bx bxs-star-half star f"></i>
    <i *ngIf="state === 'empty'" class="bx bx-star star"></i>
  </ng-container>
</div>
