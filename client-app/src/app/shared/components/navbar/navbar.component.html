<nav class="navbar">
  <a class="nav-logo" routerLink="/">
    <div class="nav-logo-icon"><i class="bx bxs-printer"></i></div>
    Smart<span>Print</span>
  </a>

  <button
    class="nav-location"
    (click)="openLocationPicker.emit()"
    aria-label="Change location"
  >
    <i class="bx bxs-map" style="color: var(--danger)"></i>
    <span *ngIf="locationService.location$ | async as loc; else defaultLoc">
      {{ loc.shortAddress }}
    </span>
    <ng-template #defaultLoc>Connaught Place, Delhi</ng-template>
    <i
      class="bx bx-chevron-down"
      style="font-size: 12px; color: var(--text-400)"
    ></i>
  </button>

  <div class="nav-search-bar" [class.visible]="showSearch">
    <i class="bx bx-search si"></i>
    <input
      type="search"
      placeholder="Search shops, services..."
      autocomplete="off"
      (input)="onSearch($any($event.target).value)"
    />
  </div>

  <div class="nav-links">
    <a
      class="nav-link"
      [routerLink]="['/']"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <i class="bx bxs-store"></i> Shops
    </a>
    <a class="nav-link" routerLink="/customer/orders" routerLinkActive="active">
      <i class="bx bx-list-ul"></i> Orders
      <span class="badge">2</span>
    </a>
    <a class="nav-link" routerLink="/customer/saved" routerLinkActive="active">
      <i class="bx bx-bookmark"></i> Saved
    </a>
    <a class="nav-avatar" routerLink="/customer/profile" title="My Profile"
      >A</a
    >
  </div>
</nav>
