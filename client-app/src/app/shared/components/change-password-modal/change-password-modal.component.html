<div class="cpm-overlay" *ngIf="show" (click)="onBackdropClick($event)">
  <div class="cpm-box">
    <div class="cpm-header">
      <div class="cpm-title">
        <i class="bx bx-lock"></i> Change password
      </div>
      <button class="cpm-close" (click)="cancel()" aria-label="Close">
        <i class="bx bx-x"></i>
      </button>
    </div>

    <div class="cpm-body">
      <div class="cpm-field">
        <label class="cpm-label">Current password</label>
        <div class="cpm-input-wrap">
          <input
            class="cpm-input"
            [type]="showCurrent ? 'text' : 'password'"
            [(ngModel)]="current"
            [class.error]="errors['current']"
          />
          <button
            type="button"
            class="cpm-eye"
            (click)="showCurrent = !showCurrent"
            tabindex="-1"
          >
            <i
              class="bx"
              [class.bx-eye-slash]="!showCurrent"
              [class.bx-eye]="showCurrent"
            ></i>
          </button>
        </div>
        <span class="cpm-err" *ngIf="errors['current']">{{
          errors["current"]
        }}</span>
      </div>

      <div class="cpm-field">
        <label class="cpm-label">New password</label>
        <div class="cpm-input-wrap">
          <input
            class="cpm-input"
            [type]="showNext ? 'text' : 'password'"
            [(ngModel)]="next"
            [class.error]="errors['next']"
          />
          <button
            type="button"
            class="cpm-eye"
            (click)="showNext = !showNext"
            tabindex="-1"
          >
            <i
              class="bx"
              [class.bx-eye-slash]="!showNext"
              [class.bx-eye]="showNext"
            ></i>
          </button>
        </div>
        <span class="cpm-err" *ngIf="errors['next']">{{ errors["next"] }}</span>
      </div>

      <div class="cpm-field">
        <label class="cpm-label">Confirm new password</label>
        <div class="cpm-input-wrap">
          <input
            class="cpm-input"
            [type]="showConfirm ? 'text' : 'password'"
            [(ngModel)]="confirm"
            [class.error]="errors['confirm']"
          />
          <button
            type="button"
            class="cpm-eye"
            (click)="showConfirm = !showConfirm"
            tabindex="-1"
          >
            <i
              class="bx"
              [class.bx-eye-slash]="!showConfirm"
              [class.bx-eye]="showConfirm"
            ></i>
          </button>
        </div>
        <span class="cpm-err" *ngIf="errors['confirm']">{{
          errors["confirm"]
        }}</span>
      </div>

      <div class="cpm-server-err" *ngIf="serverError">
        <i class="bx bx-alert-circle"></i> {{ serverError }}
      </div>
    </div>

    <div class="cpm-actions">
      <button class="cpm-btn ghost" (click)="cancel()" [disabled]="submitting">
        Cancel
      </button>
      <button
        class="cpm-btn primary"
        (click)="submit()"
        [disabled]="submitting"
      >
        <i
          class="bx"
          [class.bx-loader-alt]="submitting"
          [class.bx-spin]="submitting"
          [class.bx-check]="!submitting"
        ></i>
        {{ submitting ? "Updating..." : "Update password" }}
      </button>
    </div>
  </div>
</div>
