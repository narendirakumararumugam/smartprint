<div class="picker-backdrop" (click)="close()">
  <div class="picker-sheet" (click)="$event.stopPropagation()">
    <div class="picker-header">
      <h2 class="picker-title">Select Delivery Location</h2>
      <button class="btn-close" (click)="close()" aria-label="Close">
        <i class="bx bx-x"></i>
      </button>
    </div>
    <div class="picker-body">
      <app-inline-map-picker
        [initialCenter]="initialCenter"
        height="360px"
        (locationPicked)="onLocationPicked($event)"
      ></app-inline-map-picker>
    </div>
    <div class="picker-footer">
      <div class="picker-pin-info" *ngIf="pendingLocation; else placeholder">
        <i class="bx bx-map"></i>
        <div class="pin-text">
          <div class="pin-short">{{ pendingLocation.shortAddress }}</div>
          <div
            class="pin-city"
            *ngIf="pendingLocation.city || pendingLocation.pincode"
          >
            {{ pendingLocation.city }}
            <span *ngIf="pendingLocation.pincode">
              - {{ pendingLocation.pincode }}</span
            >
          </div>
        </div>
      </div>
      <ng-template #placeholder>
        <div class="picker-hint">
          <i class="bx bx-info-circle"> </i>Use te search above, GPS pr tap the
          map to pick a location
        </div>
      </ng-template>

      <button
        class="btn-confirm"
        [disabled]="!pendingLocation"
        (click)="confirm()"
      >
        Confirm Location
      </button>
    </div>
  </div>
</div>
